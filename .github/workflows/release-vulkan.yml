name: Build RandOverlay Vulkan Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install x64 MinGW-w64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc

      # setup-msys2 installs under the runner's temp folder, not C:\msys64. build.bat and
      # tests\run_tests.bat both read RANDOVERLAY_GCC; the bin folder also goes on PATH so
      # the compiler can load its own DLLs.
      - name: Point the build at the MinGW-w64 toolchain
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          if (-not $env:MSYS2_LOCATION) { throw 'setup-msys2 did not report msys2-location' }
          $bin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          foreach ($tool in @('g++.exe','gcc.exe','ar.exe','windres.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bin $tool))) { throw "$tool is missing from $bin" }
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
          Add-Content -LiteralPath $env:GITHUB_ENV -Value @(
            "RANDOVERLAY_GCC=$(Join-Path $bin 'g++.exe')"
            "RANDOVERLAY_GCC_C=$(Join-Path $bin 'gcc.exe')"
            "RANDOVERLAY_AR=$(Join-Path $bin 'ar.exe')"
            "RANDOVERLAY_WINDRES=$(Join-Path $bin 'windres.exe')"
          )

      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          winget install --id KhronosGroup.VulkanSDK --exact --version 1.4.341.1 --silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed: $LASTEXITCODE" }

      - name: Fetch pinned build dependencies
        shell: pwsh
        working-directory: Vulkan-DLL-Version
        run: |
          git clone https://github.com/ocornut/imgui.git deps/imgui
          git -C deps/imgui checkout 8314fc3e5a10f7c6b670225065fce1dc8cfd396b
          git clone https://github.com/TsudaKageyu/minhook.git deps/minhook
          git -C deps/minhook checkout 1e9ad1eb42db11bfcb65461f687c656612d1b555

      - name: Build Vulkan layer and fallback binaries
        shell: cmd
        working-directory: Vulkan-DLL-Version
        env:
          VULKAN_SDK: C:\VulkanSDK\1.4.341.1
        run: build.bat --no-pause

      # Same pin as validate.yml; Test-RandOverlay.ps1 checks the AHK sources with it.
      - name: Install AutoHotkey v1
        shell: pwsh
        run: choco install autohotkey.portable --version=1.1.37.1 -y --no-progress

      - name: Run unit and repository validation
        shell: pwsh
        run: |
          & .\Vulkan-DLL-Version\tests\run_tests.bat
          if ($LASTEXITCODE -ne 0) { throw "Vulkan units failed: $LASTEXITCODE" }
          .\Test-RandOverlay.ps1 -SkipAhkRuntime

      # The installer and stack suites gate publication: a failure here stops the job
      # before any release asset is built or uploaded.
      - name: Run Vulkan installer lifecycle tests
        shell: pwsh
        run: .\Vulkan-DLL-Version\tests\installer\Test-Installer.ps1

      - name: Run Vulkan stack manager tests
        shell: pwsh
        run: .\Vulkan-DLL-Version\tests\installer\Test-Stack.ps1

      - name: Build deterministic release artifacts
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.TrimStart('v') -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
          .\Vulkan-DLL-Version\installer\Build-RandOverlayRelease.ps1 -Version $version -Format Bat,Zip,Exe

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rand-overlay-vulkan
          path: |
            Vulkan-DLL-Version/dist/*.zip
            Vulkan-DLL-Version/dist/*.bat
            Vulkan-DLL-Version/dist/*.exe
            Vulkan-DLL-Version/dist/SHA256SUMS.txt
            Vulkan-DLL-Version/dist/stack-manifest.json

      - name: Publish GitHub Release assets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Unsigned bootstrap release. The self-contained BAT is the primary artifact: it embeds, verifies, and automatically installs the same release ZIP. Windows may show an Unknown Publisher or SmartScreen reputation warning."
          gh release create $env:GITHUB_REF_NAME .\Vulkan-DLL-Version\dist\*.bat .\Vulkan-DLL-Version\dist\*.zip .\Vulkan-DLL-Version\dist\*.exe .\Vulkan-DLL-Version\dist\SHA256SUMS.txt .\Vulkan-DLL-Version\dist\stack-manifest.json --title "RandOverlay $env:GITHUB_REF_NAME" --notes $notes
