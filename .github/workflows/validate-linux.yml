name: Validate (Linux)

# Builds the implicit Vulkan layer for Linux and runs the headless unit tests.
# Kept separate from validate.yml so that workflow stays a pure Windows gate
# (Test-RandOverlay.ps1 asserts its runs-on marker).
#
# Real-emulator certification is NOT done here and cannot be: it needs a native
# RPCS3/PCSX2 and a real swapchain. See Plans/linux-vulkan-layer-port.md.

on:
  push:
    paths:
      - 'Vulkan-DLL-Version/**'
      - 'RandOverlay.ini'
      - '.github/workflows/validate-linux.yml'
  pull_request:
    paths:
      - 'Vulkan-DLL-Version/**'
      - 'RandOverlay.ini'
      - '.github/workflows/validate-linux.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            vulkan-validationlayers libfontconfig1-dev \
            libxcb1-dev xvfb \
            fonts-dejavu-core fonts-liberation

      - name: Pin Dear ImGui
        run: |
          git clone https://github.com/ocornut/imgui.git Vulkan-DLL-Version/deps/imgui
          git -C Vulkan-DLL-Version/deps/imgui checkout 8314fc3e5a10f7c6b670225065fce1dc8cfd396b

      - name: Configure
        run: >
          cmake -S Vulkan-DLL-Version -B Vulkan-DLL-Version/build
          -DCMAKE_BUILD_TYPE=Release -DRANDOVERLAY_FETCH_DEPS=OFF

      - name: Build
        run: cmake --build Vulkan-DLL-Version/build -j"$(nproc)"

      - name: Verify layer artifact and exported entry points
        run: |
          so=Vulkan-DLL-Version/build/libVkLayer_RandOverlay.so
          test -f "$so" || { echo "::error::layer .so not produced"; exit 1; }
          for sym in RandOverlay_NegotiateLoaderLayerInterfaceVersion \
                     RandOverlay_GetInstanceProcAddr \
                     RandOverlay_GetDeviceProcAddr; do
            nm -D --defined-only "$so" | grep -qw "$sym" \
              || { echo "::error::missing exported symbol $sym"; exit 1; }
          done
          echo "All three negotiated entry points are exported."

      - name: Unit tests
        run: ctest --test-dir Vulkan-DLL-Version/build --output-on-failure

      - name: Layer discovery + process gate (lavapipe)
        run: |
          # Software Vulkan, so no GPU is needed. Locate the lavapipe ICD
          # rather than hardcoding its path: it moves between Mesa packagings,
          # and a stale path makes vkCreateInstance fail with "found no
          # drivers" long before any layer would be enumerated.
          lvp=$(find /usr/share/vulkan/icd.d /usr/local/share/vulkan/icd.d \
                     -name 'lvp_icd*.json' 2>/dev/null | head -1)
          if [ -z "$lvp" ]; then
            echo "::error::lavapipe ICD not found. Available ICDs:"
            ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || echo "(no icd.d)"
            exit 1
          fi
          echo "Using software ICD: $lvp"
          export VK_ICD_FILENAMES="$lvp"

          bash ./Vulkan-DLL-Version/install_layer.sh --build-dir Vulkan-DLL-Version/build
          bash ./Vulkan-DLL-Version/install_layer.sh --status

          # vulkaninfo is not an emulator, so the layer must load and then
          # immediately self-disable. That property is what makes shipping a
          # GLOBAL implicit layer safe, so assert it rather than assume it.
          # Use full output, not --summary, which omits the layer list.
          vulkaninfo > /tmp/vkinfo.txt 2>&1 || true
          grep -q VK_LAYER_RANDOVERLAY_overlay /tmp/vkinfo.txt \
            || { echo "::error::loader did not enumerate the layer"; tail -40 /tmp/vkinfo.txt; exit 1; }
          echo "Layer enumerated by the loader."

          log="$HOME/.local/share/RandOverlay/layer_debug.log"
          [ -f "$log" ] || { echo "::error::layer never loaded (no debug log)"; exit 1; }
          cat "$log"
          grep -q "disabled=1" "$log" \
            && echo "Layer self-disabled in a non-emulator host, as expected." \
            || { echo "::error::layer did not self-disable in vulkaninfo"; exit 1; }

          # And the positive case: the gate must ACTIVATE for a Linux-named
          # emulator binary. Copying a Vulkan app to "rpcs3" is enough to
          # exercise it without an emulator present.
          cp "$(command -v vulkaninfo)" /tmp/rpcs3
          rm -f "$log"
          RANDOVERLAY_NO_PROMPT=1 /tmp/rpcs3 > /dev/null 2>&1 || true
          cat "$log"
          grep -q "process=rpcs3.*disabled=0" "$log" \
            || { echo "::error::gate did not activate for a suffixless rpcs3"; exit 1; }
          echo "Gate activated for a suffixless Linux emulator name."

      - name: Live tests (present loop, overlay readback, validation)
        env:
          RANDOVERLAY_BUILD_DIR: Vulkan-DLL-Version/build
        run: |
          # xvfb supplies the X server the xcb surface needs. This is the only
          # step that exercises vkQueuePresentKHR, the semaphore handoff and
          # ImGui rendering — everything above it stops at device creation.
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            bash ./Vulkan-DLL-Version/tests/run_live_tests.sh all

      - name: Upload layer and captured frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libVkLayer_RandOverlay-linux
          path: |
            Vulkan-DLL-Version/build/libVkLayer_RandOverlay.so
            Vulkan-DLL-Version/build/RandOverlay_layer.json
            /tmp/randoverlay-live/frame.ppm
            /tmp/randoverlay-live/mock_*.txt
          if-no-files-found: warn
