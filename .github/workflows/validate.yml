name: Validate RandOverlay

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: PowerShell and AutoHotkey checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install AutoHotkey v1
        shell: pwsh
        run: choco install autohotkey.portable --version=1.1.37.1 -y --no-progress

      - name: Run validation
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          function Test-AvailableCommit {
            param([string]$Sha)

            if (-not $Sha -or $Sha -match '^0+$') {
              return $false
            }

            git rev-parse --verify --quiet "${Sha}^{commit}" | Out-Null
            return $LASTEXITCODE -eq 0
          }

          # A missing pre-push commit is normal after a guarded history rewrite.
          # Comparing the empty SHA-1 tree to HEAD validates every published file
          # instead of silently reducing `git diff --check` to a clean-worktree no-op.
          $emptyTree = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          $range = "$emptyTree..HEAD"

          if ($env:EVENT_NAME -eq "pull_request" -and (Test-AvailableCommit $env:PR_BASE_SHA)) {
            git merge-base $env:PR_BASE_SHA HEAD | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $range = "$($env:PR_BASE_SHA)...HEAD"
            }
          } elseif (Test-AvailableCommit $env:BEFORE_SHA) {
            # Two-dot tree comparison remains valid for non-ancestor force-pushes.
            $range = "$($env:BEFORE_SHA)..HEAD"
          }

          .\Test-RandOverlay.ps1 -SkipAhkRuntime -GitDiffRange $range

      - name: Run Vulkan installer lifecycle tests
        shell: pwsh
        run: .\Vulkan-DLL-Version\tests\installer\Test-Installer.ps1

      - name: Run Vulkan stack manager tests
        shell: pwsh
        run: .\Vulkan-DLL-Version\tests\installer\Test-Stack.ps1
