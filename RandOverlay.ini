[General]
; ActivePreset is the manual selection for the AHK and PS+WPF runtimes, and a
; fallback for the Vulkan layer. On Linux it is also how RAC2 and RAC3 are told
; apart: the layer cannot read the emulator's window title there, so when both
; are in EnabledPresets this value decides which one is active.
ActivePreset=RAC1
; A Linux build ignores Windows-shaped paths here (drive letters/backslashes)
; and probes XDG_DATA_HOME, ~/.local/share/Archipelago/logs and
; ~/Archipelago/logs instead. Uncomment LogDirLinux to point it somewhere else
; — without a valid log directory the overlay starts fine and then never fires.
LogDir=C:\ProgramData\Archipelago\logs
LauncherExe=C:\ProgramData\Archipelago\ArchipelagoLauncher.exe
; LogDirLinux=/home/you/Archipelago/logs
; LauncherExeLinux=/home/you/Archipelago/ArchipelagoLauncher
DisplayMs=5000
PollMs=1500
FadeInMs=300
FadeOutMs=500

[Preset.RAC1]
DisplayName=Ratchet & Clank 1
EmulatorProcesses=rpcs3.exe
ClientComponent=Ratchet & Clank Client
OverlayColor=#80A0D0
BackgroundColor=#1E1E1E
VerticalPercent=0.17
FontFamily=HandelGothic BT
FontFallback=Bahnschrift
; The two families above ship with Windows and are not present on Linux, where
; requesting them would silently fall back to ImGui's built-in bitmap font.
; The *Linux keys are read only by a Linux build. Point FontFileLinux at an
; absolute .ttf/.otf path to use the real R&C font if you have it installed.
FontFamilyLinux=DejaVu Sans
FontFallbackLinux=Liberation Sans
; FontFileLinux=/home/you/.local/share/fonts/HandelGothicBT.ttf
AhkFontSize=32
WpfFontSize=43
VulkanFontSize=48

